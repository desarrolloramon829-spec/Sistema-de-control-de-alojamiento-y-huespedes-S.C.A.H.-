<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1565C0" />
    <title>S.C.A.H. - Iniciar Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/custom.css') }}"
    />
  </head>
  <body
    class="login-body d-flex align-items-center justify-content-center min-vh-100"
  >
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="login-icon mb-3">
          <i class="bi bi-building"></i>
        </div>
        <h3 class="fw-bold text-primary">S.C.A.H.</h3>
        <p class="text-muted small">
          Sistema de Control de Alojamiento y Huéspedes
        </p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div
        class="alert alert-{{ category }} alert-dismissible fade show py-2"
        role="alert"
      >
        <small>{{ message }}</small>
        <button
          type="button"
          class="btn-close btn-close-sm"
          data-bs-dismiss="alert"
        ></button>
      </div>
      {% endfor %} {% endif %} {% endwith %}

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">
            <i class="bi bi-person"></i> Usuario
          </label>
          <input
            type="text"
            class="form-control form-control-lg"
            id="username"
            name="username"
            placeholder="Ingrese su usuario"
            autocomplete="username"
            required
            autofocus
          />
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">
            <i class="bi bi-lock"></i> Contraseña
          </label>
          <div class="input-group">
            <input
              type="password"
              class="form-control form-control-lg"
              id="password"
              name="password"
              placeholder="Ingrese su contraseña"
              autocomplete="current-password"
              required
            />
            <button
              class="btn btn-outline-secondary"
              type="button"
              onclick="togglePassword()"
            >
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">
          <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
        </button>
      </form>

      <div class="text-center mt-4">
        <small class="text-muted">v2.0 Web &bull; &copy; 2024</small>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script>
      function togglePassword() {
          const input = document.getElementById('password');
          const icon = document.getElementById('toggleIcon');
          if (input.type === 'password') {
              input.type = 'text';
              icon.className = 'bi bi-eye-slash';
          } else {
              input.type = 'password';
              icon.className = 'bi bi-eye';
          }
      }
    </script>
  </body>
</html>
