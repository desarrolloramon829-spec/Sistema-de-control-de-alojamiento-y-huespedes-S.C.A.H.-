{% extends "base.html" %} {% block title %}{{ 'Editar' if es_edicion else
'Nuevo' }} Hotel - S.C.A.H.{% endblock %} {% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="d-flex align-items-center mb-3">
      <a
        href="{{ url_for('hotels.index') }}"
        class="btn btn-sm btn-outline-secondary me-2"
      >
        <i class="bi bi-arrow-left"></i>
      </a>
      <h5 class="fw-bold mb-0">
        {{ 'Editar' if es_edicion else 'Nuevo' }} Hotel
      </h5>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <form
          method="POST"
          action="{{ url_for('hotels.editar', hotel_id=hotel_id) if es_edicion else url_for('hotels.nuevo') }}"
        >
          <div class="mb-3">
            <label class="form-label fw-semibold"
              >Nombre <span class="text-danger">*</span></label
            >
            <input
              type="text"
              name="nombre"
              class="form-control"
              value="{{ datos.get('nombre', '') if datos is mapping else datos.nombre if datos else '' }}"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Nro. Orden</label>
            <input
              type="text"
              name="nro_orden"
              class="form-control"
              value="{{ datos.get('nro_orden', '') if datos is mapping else datos.nro_orden if datos else '' }}"
            />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Ciudad / Localidad</label>
            <input
              type="text"
              name="ciudad_localidad"
              class="form-control"
              value="{{ datos.get('ciudad_localidad', '') if datos is mapping else datos.ciudad_localidad if datos else '' }}"
            />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Dirección</label>
            <input
              type="text"
              name="direccion"
              class="form-control"
              value="{{ datos.get('direccion', '') if datos is mapping else datos.direccion if datos else '' }}"
            />
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg"></i> {{ 'Actualizar' if es_edicion else
              'Crear' }}
            </button>
            <a
              href="{{ url_for('hotels.index') }}"
              class="btn btn-outline-secondary"
              >Cancelar</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
