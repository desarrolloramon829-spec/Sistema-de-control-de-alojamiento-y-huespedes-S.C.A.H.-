{% extends "base.html" %} {% block title %}Reportes - S.C.A.H.{% endblock %} {%
block content %}
<h5 class="fw-bold mb-3">
  <i class="bi bi-file-earmark-bar-graph text-primary"></i> Reportes
</h5>

<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <form method="POST" action="{{ url_for('reports.generar') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Tipo de Reporte</label>
            <select name="tipo" class="form-select" id="tipoReporte">
              <option value="general">General - Todos los huéspedes</option>
              <option value="por_hotel">Por Hotel</option>
              <option value="por_fechas">Por Rango de Fechas</option>
              <option value="estadistico">Estadístico</option>
              <option value="importaciones">Log de Importaciones</option>
              <option value="auditoria">Auditoría del Sistema</option>
            </select>
          </div>

          <div id="fechasContainer" class="mb-3" style="display:none">
            <div class="row g-2">
              <div class="col-6">
                <label class="form-label fw-semibold">Desde</label>
                <input type="date" name="desde" class="form-control" />
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold">Hasta</label>
                <input type="date" name="hasta" class="form-control" />
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Formato</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input
                  type="radio"
                  name="formato"
                  value="excel"
                  class="form-check-input"
                  id="fmtExcel"
                  checked
                />
                <label class="form-check-label" for="fmtExcel">
                  <i class="bi bi-file-earmark-excel text-success"></i> Excel
                </label>
              </div>
              <div class="form-check">
                <input
                  type="radio"
                  name="formato"
                  value="pdf"
                  class="form-check-input"
                  id="fmtPdf"
                />
                <label class="form-check-label" for="fmtPdf">
                  <i class="bi bi-file-earmark-pdf text-danger"></i> PDF
                </label>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-download"></i> Generar y Descargar
            </button>
            <a href="#" class="btn btn-outline-secondary" id="btnPreview">
              <i class="bi bi-eye"></i> Vista Previa
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
      const tipo = document.getElementById('tipoReporte');
      const fechas = document.getElementById('fechasContainer');
      const btnPreview = document.getElementById('btnPreview');

      tipo.addEventListener('change', function() {
          fechas.style.display = (this.value === 'por_fechas') ? 'block' : 'none';
      });

      btnPreview.addEventListener('click', function(e) {
          e.preventDefault();
          const t = tipo.value;
          const desde = document.querySelector('[name="desde"]').value || '';
          const hasta = document.querySelector('[name="hasta"]').value || '';
          window.location.href = `{{ url_for('reports.preview') }}?tipo=${t}&desde=${desde}&hasta=${hasta}`;
      });
  });
</script>
{% endblock %} {% endblock %}
