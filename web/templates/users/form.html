{% extends "base.html" %}
{% block title %}{{ 'Editar' if es_edicion else 'Nuevo' }} Usuario - S.C.A.H.{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="d-flex align-items-center mb-3">
            <a href="{{ url_for('users.index') }}" class="btn btn-sm btn-outline-secondary me-2">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h5 class="fw-bold mb-0">
                {{ 'Editar' if es_edicion else 'Nuevo' }} Usuario
            </h5>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <form method="POST" action="{{ url_for('users.editar', user_id=user_id) if es_edicion else url_for('users.nuevo') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Usuario <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control"
                               value="{{ datos.get('username', '') if datos is mapping else datos.username if datos else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Contraseña {% if not es_edicion %}<span class="text-danger">*</span>{% endif %}
                        </label>
                        <input type="password" name="password" class="form-control"
                               {{ 'required' if not es_edicion else '' }}>
                        {% if es_edicion %}
                        <div class="form-text">Dejar vacío para mantener la contraseña actual.</div>
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre Completo</label>
                        <input type="text" name="nombre_completo" class="form-control"
                               value="{{ datos.get('nombre_completo', '') if datos is mapping else datos.nombre_completo if datos else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Rol <span class="text-danger">*</span></label>
                        <select name="rol" class="form-select" required>
                            <option value="">— Seleccione —</option>
                            {% for r in roles %}
                            <option value="{{ r.id }}"
                                {% if (datos.get('rol', '') if datos is mapping else datos.rol if datos else '') == r.id %}selected{% endif %}>
                                {{ r.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> {{ 'Actualizar' if es_edicion else 'Crear' }}
                        </button>
                        <a href="{{ url_for('users.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
