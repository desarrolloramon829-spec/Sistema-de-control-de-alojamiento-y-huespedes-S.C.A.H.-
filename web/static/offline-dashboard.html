<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1220" />
    <title>S.C.A.H. - Dashboard offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #0f1b2d;
        color: #eaf4ff;
      }

      section {
        max-width: 460px;
        padding: 28px;
        border-radius: 20px;
        background: rgba(20, 36, 58, 0.94);
        border: 1px solid rgba(103, 183, 255, 0.18);
      }

      h1 { margin-top: 0; }
      p { color: #a8bed3; line-height: 1.55; }
      a { color: #23c0ff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <section>
      <h1>Dashboard sin conexión</h1>
      <p>
        El centro de mando necesita datos en tiempo real. Si ya visitaste otras
        pantallas, podés seguir consultando vistas cacheadas hasta recuperar la
        conexión.
      </p>
      <a href="/dashboard">Reintentar carga</a>
    </section>
  </body>
</html>
